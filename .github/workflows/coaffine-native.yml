name: Unseeded native coaffine proofs and portability checks

on:
  pull_request:
    paths:
      - "packages/pycliques/src/pycliques/_coaffine_native.cpp"
      - "packages/pycliques/src/pycliques/coaffine_endomorphisms.py"
      - "research/replay_cubic14_379.py"
      - "packages/pycliques/src/pycliques/octahedral_coaffine.py"
      - "packages/pycliques/src/pycliques/_octahedral_sat*.py"
      - "packages/pycliques/tests/test_octahedral_sat.py"
      - "research/replay_cubic14_sat.py"
      - "packages/pycliques/src/pycliques/octahedral_coaffine_native.py"
      - "packages/pycliques/tests/test_octahedral_coaffine_native.py"
      - "packages/pycliques/tests/test_general_retraction_searches.py"
      - "packages/pycliques/tests/test_octahedral_coaffine.py"
      - "packages/pycliques/tests/test_octahedral_coaffine_native_protocol.py"
      - ".github/workflows/coaffine-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native C++17 / Python 3.11 unseeded reproductions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11
      - run: uv sync
      - name: Verify portable wheel includes native source (no bundled binary)
        run: |
          uv build --package pycliques --wheel --out-dir /tmp/pycliques-wheel
          uv run python -c "from pathlib import Path; import zipfile; wheels=list(Path('/tmp/pycliques-wheel').glob('*.whl')); assert len(wheels)==1; z=zipfile.ZipFile(wheels[0]); assert 'pycliques/_coaffine_native.cpp' in z.namelist(); assert 'pycliques/octahedral_coaffine_native.py' in z.namelist()"
      - name: Test optional build, exact small-graph comparisons and false-positive guards
        run: |
          uv run pytest -q packages/pycliques/tests/test_octahedral_coaffine_native.py packages/pycliques/tests/test_octahedral_coaffine_native_protocol.py -m "not slow"
      - name: Measure shared coaffine search coverage (diagnostic)
        run: |
          uv run pytest -q packages/pycliques/tests/test_octahedral_coaffine_native.py packages/pycliques/tests/test_octahedral_coaffine_native_protocol.py packages/pycliques/tests/test_general_retraction_searches.py packages/pycliques/tests/test_octahedral_coaffine.py -m "not slow" --cov=pycliques.octahedral_coaffine_native --cov=pycliques.coaffine_endomorphisms --cov=pycliques.octahedral_coaffine --cov-report=term-missing
      - name: Rediscover McKay 253650 and cubic 379 without stored targets
        run: uv run pytest -q packages/pycliques/tests/test_octahedral_coaffine_native.py -m slow
      - name: Test explicit build entry point
        run: |
          uv run python -m pycliques.octahedral_coaffine_native --build
          uv run python -c "import pycliques as pc, networkx as nx; r=pc.find_octahedral_retraction_coaffine(nx.octahedral_graph()); assert r.dimension == 3"
      - name: Reproduce cubic 379 homotopy and divergence using both packages
        run: uv run python research/replay_cubic14_379.py
      - name: Reproduce two cubic SAT retractions without stored maps
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-4
          uv run python research/replay_cubic14_sat.py
