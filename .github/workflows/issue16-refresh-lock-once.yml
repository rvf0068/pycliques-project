# One-time, same-repository PR lockfile regeneration. The workflow removes
# itself in the same commit as the newly resolved lockfile.
name: Resolve issue 16 GUDHI dependency lock
on:
  pull_request:
    paths:
      - ".github/workflows/issue16-refresh-lock-once.yml"
      - "packages/pycombtop/pyproject.toml"
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue16-gudhi-exact-homology'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@v4
      - name: Regenerate reproducible uv.lock using actual package metadata
        run: uv lock --python 3.11
      - name: Commit lockfile and remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git rm .github/workflows/issue16-refresh-lock-once.yml
          git diff --cached --quiet && { echo 'No lockfile change'; exit 1; }
          git commit -m 'Lock GUDHI 3.13.0 and remove temporary lock-refresh workflow'
          git push origin HEAD:fix/issue16-gudhi-exact-homology
