name: Temporary facet-puncture formatter diagnostic
on:
  pull_request:
    paths:
      - "packages/pycombtop/src/pycombtop/facet_punctures.py"
      - "packages/pycombtop/tests/test_facet_punctures.py"
      - ".github/workflows/facet-puncture-format-debug.yml"
permissions:
  contents: read
jobs:
  show-exact-ruff-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.15.7"
      - name: Show formatting differences for the two new files
        run: |
          ruff format --diff packages/pycombtop/src/pycombtop/facet_punctures.py packages/pycombtop/tests/test_facet_punctures.py || true
