name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync

      - name: Emit exact Ruff-formatted source (temporary diagnostic)
        run: |
          uv run ruff format packages/pycliques/src/pycliques/octahedral_blind.py packages/pycliques/src/pycliques/octahedral_blind_search.py packages/pycliques/src/pycliques/octahedral_joint_fibers.py packages/pycliques/tests/test_octahedral_blind.py packages/pycliques/tests/test_blind_snub_regression.py
          python - <<'PY'
          import json
          from pathlib import Path
          for p in ("packages/pycliques/src/pycliques/octahedral_blind.py", "packages/pycliques/src/pycliques/octahedral_blind_search.py", "packages/pycliques/src/pycliques/octahedral_joint_fibers.py", "packages/pycliques/tests/test_octahedral_blind.py", "packages/pycliques/tests/test_blind_snub_regression.py"):
              print("AUTOFORMAT_JSON:" + json.dumps({"path": p, "content": Path(p).read_text()}, ensure_ascii=True))
          PY

      - name: Ruff check
        run: uv run ruff check packages/

      - name: Ruff format check
        run: uv run ruff format --check packages/

      - name: Mypy
        run: uv run mypy packages/
