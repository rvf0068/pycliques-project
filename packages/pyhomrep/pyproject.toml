[project]
name = "pyhomrep"
version = "0.1.0"
description = "Group representations on homology"
readme = "README.md"
authors = [
    { name = "Rafael Villarroel", email = "rvf0068@gmail.com" },
    { name = "Manuel Campero", email = "leunamqwerty@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "numpy>=2.0.0",
    "pycliques",
    "pycombtop",
    "sympy>=1.14.0",
]

[tool.uv.sources]
pycliques = { workspace = true }
pycombtop = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"