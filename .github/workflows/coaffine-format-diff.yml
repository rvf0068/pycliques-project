name: Temporary diagnostic for coaffine formatter differences

on:
  push:
    branches:
      - research/coaffine-endomorphism-octahedral-retractions
    paths:
      - ".github/workflows/coaffine-format-diff.yml"

permissions:
  contents: read

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.7
      - name: Format files then emit exact base64 for applying via connector
        run: |
          ruff format packages/pycliques/src/pycliques/octahedral_coaffine.py packages/pycliques/tests/test_octahedral_coaffine.py
          python - <<'PY'
          import base64
          from pathlib import Path
          for path in [
              "packages/pycliques/src/pycliques/octahedral_coaffine.py",
              "packages/pycliques/tests/test_octahedral_coaffine.py",
          ]:
              encoded = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              print("FORMATTED_START", path)
              print(encoded)
              print("FORMATTED_END", path)
          PY
