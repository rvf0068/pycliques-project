name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync

      # Temporary diagnostic; removed after recovering the formatter output.
      - name: Export formatted coverage tests
        run: |
          sed -i '/^# fmt: off$/d' packages/pycliques/tests/test_octahedral_blind_paths.py
          sed -i '/^def test_emit_ruff_formatted_source():/,$d' packages/pycliques/tests/test_octahedral_blind_paths.py
          uv run ruff format packages/pycliques/tests/test_octahedral_blind_paths.py
          base64 -w0 packages/pycliques/tests/test_octahedral_blind_paths.py | fold -w 2000 | sed 's/^/RUTFMT:/'

      - name: Ruff check
        run: uv run ruff check packages/

      - name: Ruff format check
        run: uv run ruff format --check packages/

      - name: Mypy
        run: uv run mypy packages/
