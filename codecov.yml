# The CI test matrix has 4 packages x 4 Python versions, and each test
# job uploads exactly one coverage XML report under its package flag.
#
# Without a synchronization barrier, Codecov posts its project status
# after partial uploads (especially before the slower pycliques tests),
# producing a spurious project-coverage regression on otherwise green
# commits. Delay both statuses and PR comments until all 16 reports are
# processed. Keep Codecov's existing project/patch thresholds unchanged.
#
# IMPORTANT: Update after_n_builds if the matrix or upload count changes.
codecov:
  notify:
    after_n_builds: 16

comment:
  after_n_builds: 16
