name: Format contractible carriers (temporary)
on:
  push:
    branches: [research/bounded-contractible-carrier-attachments]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Format touched modules and tests
        run: |
          uv run ruff check --fix \
            packages/pycombtop/src/pycombtop/contractible_carriers.py \
            packages/pycombtop/src/pycombtop/attachment_certificates.py \
            packages/pycombtop/src/pycombtop/homotopy_type.py \
            packages/pycombtop/tests/test_contractible_carriers.py
          uv run ruff format \
            packages/pycombtop/src/pycombtop/contractible_carriers.py \
            packages/pycombtop/src/pycombtop/attachment_certificates.py \
            packages/pycombtop/src/pycombtop/homotopy_type.py \
            packages/pycombtop/tests/test_contractible_carriers.py
      - name: Commit format-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pycombtop/src/pycombtop/contractible_carriers.py \
                  packages/pycombtop/src/pycombtop/attachment_certificates.py \
                  packages/pycombtop/src/pycombtop/homotopy_type.py \
                  packages/pycombtop/tests/test_contractible_carriers.py
          if ! git diff --cached --quiet; then
            git commit -m "Format contractible-carrier certificates with Ruff"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
