name: Temporary diagnostic for coaffine formatter differences

on:
  push:
    branches:
      - research/coaffine-endomorphism-octahedral-retractions
    paths:
      - ".github/workflows/coaffine-format-diff.yml"

permissions:
  contents: read

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.7
      - name: Print formatter changes for new source and tests
        run: |
          ruff format --diff packages/pycliques/src/pycliques/octahedral_coaffine.py packages/pycliques/tests/test_octahedral_coaffine.py || true
