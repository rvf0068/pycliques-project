name: Format spherical-link PR (temporary)
on:
  push:
    branches: [research/nullhomotopic-spherical-link-attachments]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Ruff format touched Python files
        run: |
          uv run ruff format \
            packages/pycombtop/src/pycombtop/homotopy_type.py \
            packages/pycombtop/tests/test_spherical_link_attachment.py
      - name: Commit deterministic formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pycombtop/src/pycombtop/homotopy_type.py \
                  packages/pycombtop/tests/test_spherical_link_attachment.py
          if ! git diff --cached --quiet; then
            git commit -m "Format new spherical-link implementation with Ruff"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
