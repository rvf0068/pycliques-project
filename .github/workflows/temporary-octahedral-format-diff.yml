name: Temporary octahedral formatting diagnostic
on:
  push:
    branches:
      - feature/general-octahedral-amplification-and-augmentation
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Report requested formatting
        run: |
          uv run ruff format --diff packages/pycliques/tests/test_octahedral_amplification_edge_cases.py
