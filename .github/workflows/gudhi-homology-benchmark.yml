name: Benchmark shared GUDHI homology backend

on:
  pull_request:
    paths:
      - "research/benchmark_gudhi_target_betti.py"
      - ".github/workflows/gudhi-homology-benchmark.yml"
      - "packages/pycombtop/src/pycombtop/bounded_betti.py"
      - "packages/pycombtop/src/pycombtop/homology_backend.py"
      - "packages/pycombtop/src/pycombtop/homotopy_type.py"
      - "packages/pycombtop/tests/test_gudhi_homology_issue16.py"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --python 3.11
      - name: Compare production GUDHI against independently reconstructed exact GF2
        run: .venv/bin/python research/benchmark_gudhi_target_betti.py
