name: Temporary Ruff format for patch coverage tests
on:
  push:
    branches: [research/nullhomotopic-spherical-link-attachments]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Format new regression tests
        run: |
          uv run ruff check --fix packages/pycombtop/tests/test_spherical_link_attachment.py
          uv run ruff format packages/pycombtop/tests/test_spherical_link_attachment.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pycombtop/tests/test_spherical_link_attachment.py
          if ! git diff --cached --quiet; then
            git commit -m "Ruff-format coverage regression tests"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
