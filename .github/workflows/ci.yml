name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.package }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # List your packages here. 
        # Ideally, 'pyg6data' is tested first if others depend on it, 
        # but parallel execution handles this fine.
        package: ["pycliques", "pyg6data", "pycombtop", "pyhomrep"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true  # IMPORTANT: Pulls LFS files if you store .g6.gz data there

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        # This reads uv.lock and installs the whole workspace + dev tools (pytest)
        run: uv sync

      - name: Run Tests
        # Runs pytest on the specific package folder
        # --cov generates the report for Codecov
        run: |
          uv run pytest packages/${{ matrix.package }} \
            --cov=packages/${{ matrix.package }}/src \
            --cov-report=xml:coverage-${{ matrix.package }}.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-${{ matrix.package }}.xml
          flags: ${{ matrix.package }}
          fail_ci_if_error: false # Don't break build if Codecov is down

  research:
    name: Research regression tests (Python 3.11)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install Dependencies
        run: uv sync
      - name: Run fast research tests
        run: uv run pytest research/test_homotopy_research.py -m "not slow"

  research-order-eight:
    name: Order-8 research census (Python 3.11)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install Dependencies
        run: uv sync
      - name: Run order-8 candidate-count regression
        run: uv run pytest research/test_homotopy_research.py -m slow
