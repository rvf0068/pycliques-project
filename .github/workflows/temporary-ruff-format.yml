name: Temporary Ruff formatting for homotopy audit
on:
  push:
    branches:
      - fix/homotopy-certificates-and-vertex-attachments
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Format changed files
        run: |
          uv run ruff format packages/pycombtop/src/pycombtop/homotopy_type.py packages/pycombtop/src/pycombtop/simplex.py packages/pycombtop/tests/test_homotopy_type.py
          uv run ruff check packages/pycombtop/src/pycombtop/homotopy_type.py packages/pycombtop/src/pycombtop/simplex.py packages/pycombtop/tests/test_homotopy_type.py
      - name: Commit exact Ruff formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pycombtop/src/pycombtop/homotopy_type.py packages/pycombtop/src/pycombtop/simplex.py packages/pycombtop/tests/test_homotopy_type.py
          if ! git diff --cached --quiet; then
            git commit -m "style(pycombtop): apply Ruff formatter to homotopy audit"
            git push
          fi
