[project]
name = "pycliques-project"
version = "0.1.0"
description = "Monorepo for the Pycliques Graph Theory Ecosystem"
requires-python = ">=3.11"
dependencies = [
    "pycliques",
    "pyg6data",
    "pycombtop",
    "pyhomrep",
    "rich>=14.3.3",
]

[tool.uv]
workspace.members = ["packages/*"]

[tool.uv.sources]
# This allows installing all docs dependencies at the root level easily
pycliques = { workspace = true }
pyg6data = { workspace = true }
pycombtop = { workspace = true }
pyhomrep = { workspace = true }

[dependency-groups]
dev = [
    "sphinx>=9.0.4",
    "pydata-sphinx-theme>=0.15.4",
    "pytest>=8.3.3",
    "pytest-cov",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "*/tests/*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pyhomrep.*"]
# pyhomrep uses sympy which has incomplete type stubs
# and complex return types that are difficult to type precisely
warn_return_any = false
disallow_untyped_defs = false
disable_error_code = ["union-attr", "arg-type", "index", "list-item", "assignment"]
