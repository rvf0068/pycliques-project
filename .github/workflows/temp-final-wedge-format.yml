name: Final wedge PR Ruff format (temporary)
on:
  push:
    branches: [research/nullhomotopic-spherical-link-attachments]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Ruff format generalized cofiber implementation
        run: |
          uv run ruff check --fix packages/pycombtop/src/pycombtop/homotopy_type.py
          uv run ruff format packages/pycombtop/src/pycombtop/homotopy_type.py
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pycombtop/src/pycombtop/homotopy_type.py
          if ! git diff --cached --quiet; then
            git commit -m "Format prioritized spherical-link candidate search"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
