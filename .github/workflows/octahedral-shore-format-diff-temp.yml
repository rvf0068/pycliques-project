name: Temporary two-shore Ruff format diff

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Print exact Ruff 0.15.7 format diff (diagnostic)
        run: |
          uv run ruff format --diff packages/pycliques/src/pycliques/octahedral_shore_retractions.py packages/pycliques/tests/test_octahedral_shore_retractions.py || true
