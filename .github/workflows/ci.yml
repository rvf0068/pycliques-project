name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      PACKAGE: ${{ matrix.package }}
    name: Test ${{ matrix.package }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        package: ["pycliques", "pyg6data", "pycombtop", "pyhomrep"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true  # IMPORTANT: Pulls LFS files if you store .g6.gz data there

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked test dependencies
        run: uv sync --locked --python "$PYTHON_VERSION" --no-default-groups --group test

      - name: Install optional SAT test backend
        if: matrix.package == 'pycliques'
        run: sudo apt-get update && sudo apt-get install -y libz3-4

      - name: Run Tests
        timeout-minutes: 15
        run: |
          .venv/bin/python -c 'import os, sys; assert ".".join(map(str, sys.version_info[:2])) == os.environ["PYTHON_VERSION"], sys.version'
          args=(--durations=8)
          if [[ "$PYTHON_VERSION" == "3.12" ]]; then
            args+=(--cov="packages/$PACKAGE/src" --cov-report="xml:coverage-$PACKAGE.xml")
          fi
          .venv/bin/python -m pytest "packages/$PACKAGE" "${args[@]}"

      - name: Upload to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-${{ matrix.package }}.xml
          flags: ${{ matrix.package }}
          fail_ci_if_error: false # Don't break build if Codecov is down

  codecov-finalize:
    name: Publish final Codecov status
    needs: test
    # When any matrix leg fails, the other test jobs and available coverage
    # uploads still finish. Notify Codecov exactly once when all legs have
    # completed; do not require a fixed number of successful uploads.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Publish project and patch status after all matrix jobs
        uses: codecov/codecov-action@v5
        with:
          run_command: send-notifications
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  research:
    name: Research regression tests (Python 3.11)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install Dependencies
        run: uv sync --locked --python 3.11 --no-default-groups --group test
      - name: Run fast research tests
        run: .venv/bin/python -m pytest research -m "not slow"

  wheels:
    name: Installed wheels and command-line entry points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build --all-packages --wheel --out-dir "$RUNNER_TEMP/wheels"
      - name: Exercise base and cooperating packages outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.12 wheel-env
          export VIRTUAL_ENV="$PWD/wheel-env"
          export PATH="$VIRTUAL_ENV/bin:$PATH"
          uv pip install wheels/pycliques-*.whl
          python -c 'import networkx as nx, pycliques as p; assert len(p.clique_graph(nx.cycle_graph(4))) == 4'
          small-behavior --help
          small-behavior-clockwork-pairs --help
          find-retractions --help
          uv pip install wheels/*.whl
          python -c 'from pyg6data import graph_generator; from pycombtop import first_homology_rank; import pyhomrep; assert len(next(graph_generator(6))) == 6'
          homotopy-indeterminate --help
          extract-graphs --help

  research-order-eight:
    name: Order-8 research census (Python 3.11)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install Dependencies
        run: uv sync --locked --python 3.11 --no-default-groups --group test
      - name: Run order-8 candidate-count regression
        run: uv run --no-sync --python 3.11 pytest research/test_homotopy_research.py -m slow

  research-helly-certificate-replay:
    name: Full Helly-cover certificate replay (Python 3.11)
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install Dependencies
        run: uv sync --locked --python 3.11 --no-default-groups --group test
      - name: Replay rank-four certificate
        run: |
          uv run --no-sync --python 3.11 python research/o8_helly_cover_certificates.py \
            --check research/results/o8_four_uniform_helly_certificate.json
      - name: Replay rank-four/five certificate
        run: |
          uv run --no-sync --python 3.11 python research/o8_helly_cover_certificates.py \
            --check research/results/o8_helly_gate_certificate.json
