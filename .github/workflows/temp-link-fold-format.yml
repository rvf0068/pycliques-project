name: Format bounded link-collapse PR (temporary)
on:
  push:
    branches: [research/certified-bounded-link-scollapses]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Apply pinned Ruff to touched files
        run: |
          uv run ruff check --fix \
            packages/pycombtop/src/pycombtop/wedge_certificates.py \
            packages/pycombtop/src/pycombtop/homotopy_type.py \
            packages/pycombtop/tests/test_spherical_link_attachment.py
          uv run ruff format \
            packages/pycombtop/src/pycombtop/wedge_certificates.py \
            packages/pycombtop/src/pycombtop/homotopy_type.py \
            packages/pycombtop/tests/test_spherical_link_attachment.py
      - name: Commit deterministic formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pycombtop/src/pycombtop/wedge_certificates.py \
                  packages/pycombtop/src/pycombtop/homotopy_type.py \
                  packages/pycombtop/tests/test_spherical_link_attachment.py
          if ! git diff --cached --quiet; then
            git commit -m "Format bounded link-collapse certificate and tests"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
