name: Temporary snub formatting diagnostic
on:
  push:
    branches:
      - feature/classifier-seeded-snub-o24-retraction-v1
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Report requested formatting
        run: |
          uv run ruff format --diff packages/pycliques/tests/test_small_snub_seeded_invariants.py
